<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融研究仪表盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1a1b1e;--bg2:#222326;--bg3:#2a2b2f;--bg4:#333438;
  --border:#3a3b40;--border2:#4a4b50;
  --t1:#f0f0f2;--t2:#b0b0b8;--t3:#888890;--t4:#666670;
  --accent:#22c55e;--accent2:#4ade80;--accent-bg:rgba(34,197,94,0.10);
  --danger:#ef4444;--warn:#eab308;--info:#3b82f6;
  --cat-macro:#a78bfa;--cat-comm:#fb923c;--cat-stock:#34d399;--cat-other:#9ca3af;--cat-mix:#fbbf24;
  --sidebar-bg:#1e1f23;--topbar-bg:#222326;--input-bg:#2a2b2f;--hover-bg:#333438;
}
[data-theme="light"]{
  --bg:#f0f1f3;--bg2:#ffffff;--bg3:#ffffff;--bg4:#f7f8fa;
  --border:#e0e1e5;--border2:#d0d1d5;
  --t1:#1a1a2e;--t2:#555566;--t3:#888899;--t4:#aaaabb;
  --accent:#c4192c;--accent2:#e03050;--accent-bg:rgba(196,25,44,0.06);
  --danger:#c4192c;--warn:#d48806;--info:#1890ff;
  --cat-macro:#722ed1;--cat-comm:#d46b08;--cat-stock:#389e0d;--cat-other:#8c8c8c;--cat-mix:#d4b106;
  --sidebar-bg:#1a1a2e;--topbar-bg:#ffffff;--input-bg:#f7f8fa;--hover-bg:#eef0f3;
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--t1);display:flex;height:100vh;overflow:hidden;transition:background .2s,color .2s}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sidebar{width:200px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
[data-theme="light"] .sidebar{color:#e0e0e8}
.s-logo{padding:20px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.s-logo h1{font-size:13px;font-weight:700;color:var(--accent2);letter-spacing:-0.02em}
[data-theme="light"] .s-logo h1{color:#e03050}
.s-logo p{font-size:10px;color:rgba(255,255,255,.35);margin-top:3px}
[data-theme="light"] .s-logo p{color:rgba(255,255,255,.5)}
.s-nav{padding:8px 6px;flex:1}
.s-section{font-size:9px;text-transform:uppercase;color:rgba(255,255,255,.3);padding:14px 10px 5px;letter-spacing:1px}
.s-item{display:flex;align-items:center;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:rgba(255,255,255,.6);margin-bottom:1px;transition:.15s}
.s-item:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
.s-item.active{background:rgba(34,197,94,.15);color:#4ade80;font-weight:500}
[data-theme="light"] .s-item.active{background:rgba(224,48,80,.15);color:#e03050}
.s-item.off{opacity:.35;cursor:not-allowed}
.s-item .ic{margin-right:8px;font-size:14px;width:18px;text-align:center}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:44px;background:var(--topbar-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;justify-content:space-between;flex-shrink:0;transition:background .2s}
.topbar h2{font-size:13px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:10px}
.btn{padding:5px 14px;border-radius:5px;border:none;cursor:pointer;font-size:11px;font-weight:500;transition:.15s}
.btn-p{background:var(--accent);color:#fff}[data-theme="light"] .btn-p{color:#fff}.btn-p:hover{opacity:.85}
.btn-o{background:transparent;color:var(--t2);border:1px solid var(--border)}.btn-o:hover{border-color:var(--border2);color:var(--t1)}
.btn-s{padding:3px 8px;font-size:10px}
.theme-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s;color:var(--t2)}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.content{flex:1;overflow-y:auto;padding:16px 20px;transition:background .2s}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:8px 16px;font-size:12px;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.tab:hover{color:var(--t1)}.tab.active{color:var(--accent2);border-bottom-color:var(--accent)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px;transition:background .2s,border .2s}
.card .l{font-size:10px;color:var(--t4);margin-bottom:4px}
.card .v{font-size:22px;font-weight:700}
.card .s{font-size:10px;color:var(--t3);margin-top:3px}
.up-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:18px}
.up-c{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px;transition:background .2s,border .2s}
.up-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.up-n{font-size:14px;font-weight:600}
.up-d{font-size:10px;color:var(--t4)}
.tag{font-size:9px;padding:2px 7px;border-radius:8px;display:inline-block;margin:2px}
.t-macro{color:var(--cat-macro);background:color-mix(in srgb,var(--cat-macro) 12%,transparent)}
.t-comm{color:var(--cat-comm);background:color-mix(in srgb,var(--cat-comm) 12%,transparent)}
.t-stock{color:var(--cat-stock);background:color-mix(in srgb,var(--cat-stock) 12%,transparent)}
.t-other{color:var(--cat-other);background:color-mix(in srgb,var(--cat-other) 12%,transparent)}
.t-mix{color:var(--cat-mix);background:color-mix(in srgb,var(--cat-mix) 12%,transparent)}
.fbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.fbar select,.fbar input{background:var(--input-bg);border:1px solid var(--border);color:var(--t1);padding:6px 10px;border-radius:5px;font-size:11px;transition:background .2s,border .2s}
.fbar input{flex:1;min-width:180px}
.fbar select:focus,.fbar input:focus{outline:none;border-color:var(--accent)}
.vl{display:flex;flex-direction:column;gap:6px}
.vi{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:12px 14px;cursor:pointer;transition:.15s}
.vi:hover{border-color:var(--accent);background:var(--hover-bg)}
.vi .vh{display:flex;justify-content:space-between;align-items:center}
.vi .vt{font-size:12px;font-weight:500;flex:1}
.vi .vm{display:flex;gap:10px;font-size:10px;color:var(--t4);align-items:center}
.vi .vp{font-size:11px;color:var(--t2);line-height:1.6;margin-top:8px;max-height:0;overflow:hidden;transition:max-height .3s}
.vi.open .vp{max-height:500px;overflow-y:auto}
.detail{position:fixed;top:0;right:-560px;width:560px;height:100vh;background:var(--bg2);border-left:1px solid var(--border);z-index:100;transition:right .3s,background .2s;display:flex;flex-direction:column}
.detail.show{right:0}
.detail .dh{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.detail .dh h3{font-size:13px;font-weight:600;flex:1;margin-right:8px}
.detail .db{flex:1;overflow-y:auto;padding:16px}
.detail .dm{margin-bottom:12px}.detail .dm span{font-size:10px;color:var(--t4);margin-right:12px}
.detail .dc{font-size:12px;line-height:1.8;color:var(--t2);white-space:pre-wrap}
.pag{display:flex;justify-content:center;gap:4px;margin-top:14px}
.pb{padding:5px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--t2);cursor:pointer;font-size:11px}
.pb.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* 架构蓝图 */
.layer-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;transition:background .2s,border .2s}
.layer-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.layer-indicator{width:4px;height:36px;border-radius:2px;flex-shrink:0}
.layer-title{font-size:14px;font-weight:700}
.layer-subtitle{font-size:10px;color:var(--t4)}
.layer-desc{font-size:11px;color:var(--t3)}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.mod-card{background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:10px;transition:.15s}
.mod-card.active{border-style:solid}
.mod-card.placeholder{border-style:dashed;opacity:.5}
.mod-card.planned{border-style:dashed;opacity:.7}
.mod-card{cursor:pointer}.mod-card:hover{border-color:var(--accent);background:var(--accent-bg);transform:translateY(-1px)}
.mod-name{font-size:12px;font-weight:600;margin-bottom:4px}
.mod-desc{font-size:9px;color:var(--t4);line-height:1.4}
.mod-children{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.mod-child{font-size:8px;padding:1px 5px;border-radius:3px;background:var(--bg3);color:var(--t3)}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
.status-dot.active{background:var(--accent)}
.status-dot.planned{background:var(--warn)}
.status-dot.placeholder{background:var(--t4)}
.restructure-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:16px}
.restructure-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.restructure-compare{display:flex;align-items:center;gap:8px;font-size:11px}
.arrow{color:var(--t3);font-size:14px}
.step-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.step-item:last-child{border-bottom:none}
.step-num{width:20px;height:20px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--t3)}
.step-info{flex:1}
.step-name{font-size:12px;font-weight:500}
.step-desc{font-size:10px;color:var(--t4)}
.priority-tag{font-size:9px;padding:2px 6px;border-radius:3px}
.priority-high{background:rgba(239,68,68,0.15);color:var(--danger)}
.priority-medium{background:rgba(234,179,8,0.15);color:var(--warn)}
/* 模块下钻详情 */
.bp-drill{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.bp-drill-panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;width:90%;max-width:720px;max-height:80vh;display:flex;flex-direction:column;animation:slideUp .2s}
.bp-drill-header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.bp-drill-back{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t3);transition:.15s;flex-shrink:0}
.bp-drill-back:hover{border-color:var(--accent);color:var(--accent)}
.bp-drill-title{font-size:16px;font-weight:700;flex:1}
.bp-drill-status{font-size:10px;padding:2px 8px;border-radius:4px}
.bp-drill-status.active{background:var(--accent-bg);color:var(--accent)}
.bp-drill-status.planned{background:rgba(234,179,8,0.15);color:var(--warn)}
.bp-drill-status.placeholder{background:rgba(100,100,100,0.15);color:var(--t4)}
.bp-drill-body{overflow-y:auto;padding:16px 20px;flex:1}
.bp-drill-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.bp-drill-meta-item{font-size:10px;padding:3px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--t3)}
.bp-drill-meta-item strong{color:var(--t2);margin-right:4px}
.bp-drill-desc{font-size:12px;color:var(--t2);line-height:1.6;margin-bottom:16px;padding:10px 12px;background:var(--bg3);border-radius:6px}
.bp-drill-subs-title{font-size:12px;font-weight:600;color:var(--t3);margin-bottom:10px}
.bp-drill-sub{position:relative;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;transition:.15s}
.bp-drill-sub:hover{border-color:var(--accent)}
.bp-drill-sub-name{font-size:12px;font-weight:600;margin-bottom:4px}
.bp-drill-sub-desc{font-size:10px;color:var(--t4);line-height:1.4}
.bp-drill-sub-status{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;margin-left:6px}
.bp-drill-sub-status.active{background:var(--accent-bg);color:var(--accent)}
.bp-drill-sub-status.planned{background:rgba(234,179,8,0.15);color:var(--warn)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* 引用ID复制按钮 */
[data-ref]{position:relative}
.ref-copy-btn{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:5px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:12px;display:none;align-items:center;justify-content:center;z-index:10;color:var(--t3);transition:.15s;opacity:0.7}
[data-ref]:hover > .ref-copy-btn{display:flex}
[data-ref]:has([data-ref]:hover) > .ref-copy-btn{display:none !important}
.ref-copy-btn:hover{opacity:1;border-color:var(--accent);color:var(--accent)}
.ref-copy-btn.copied{color:var(--accent);opacity:1}

.ref-tooltip{position:absolute;top:100%;right:0;margin-top:4px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:10px;color:var(--t2);white-space:pre;line-height:1.5;z-index:200;pointer-events:none;display:none;min-width:240px;max-width:360px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.ref-copy-btn:hover > .ref-tooltip{display:block}
/* 侧边栏导航项 - 悬浮显示ref标签 */
.s-nav{position:relative}
.s-item[data-ref]:hover::after{content:"#" attr(data-ref);position:absolute;left:60px;top:50%;transform:translateY(-50%);background:var(--bg3);border:1px solid var(--border);padding:2px 8px;border-radius:4px;font-size:10px;color:var(--t3);white-space:nowrap;z-index:100}

/* 平台标签 */
.plat-tag{display:inline-flex;align-items:center;gap:3px;font-size:9px;padding:2px 7px;border-radius:3px;margin-right:4px}
.plat-tag.bili{background:#fb7299;background:rgba(251,114,153,0.15);color:#fb7299}
.plat-tag.yt{background:#ff0000;background:rgba(255,0,0,0.12);color:#ff4444}
.plat-tag.other{background:rgba(100,100,100,0.15);color:var(--t4)}
/* 平台筛选器 */
.plat-filter{display:flex;gap:6px;margin-bottom:12px}
.plat-filter button{padding:4px 12px;border-radius:5px;font-size:11px;border:1px solid var(--border);background:var(--bg3);color:var(--t3);cursor:pointer;transition:.15s}
.plat-filter button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.plat-filter button:hover:not(.active){border-color:var(--accent)}
/* 添加UP主弹窗 */
.add-up-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.add-up-panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;width:90%;max-width:480px;animation:slideUp .2s}
.add-up-header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.add-up-title{font-size:16px;font-weight:700;flex:1}
.add-up-body{padding:20px}
.add-up-field{margin-bottom:14px}
.add-up-field label{display:block;font-size:11px;color:var(--t3);margin-bottom:4px;font-weight:500}
.add-up-field input,.add-up-field select{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--t1);padding:8px 12px;border-radius:6px;font-size:12px;box-sizing:border-box}
.add-up-field input:focus,.add-up-field select:focus{outline:none;border-color:var(--accent)}
.add-up-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.add-up-footer .btn{padding:7px 18px}
/* 待处理队列 */
.pending-section{margin-top:16px}
.pending-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;font-size:11px}
.pending-item .plat-tag{flex-shrink:0}
.pending-status{font-size:9px;padding:2px 6px;border-radius:3px}
.pending-status.queued{background:rgba(234,179,8,0.15);color:var(--warn)}
.pending-status.processing{background:var(--accent-bg);color:var(--accent)}
.pending-status.done{background:rgba(34,197,94,0.15);color:#22c55e}
.pending-status.error{background:rgba(239,68,68,0.15);color:#ef4444}
.task-progress{height:4px;background:var(--bg3);border-radius:2px;margin:6px 0 2px;overflow:hidden}
.task-progress-bar{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.task-progress-info{display:flex;justify-content:space-between;font-size:9px;color:var(--t4)}
</style>
<script>
// AUTH MODULE - isolated from all other scripts
(function() {
  var PWD_HASH = 'ac50201d8b39de3e403adc70ae473c786d0ccc46c694ba8d68c84b0e1633c71e';
  var SEVEN_DAYS = 7 * 24 * 60 * 60 * 1000;
  function sha256(str) {
    var buffer = new TextEncoder().encode(str);
    return crypto.subtle.digest('SHA-256', buffer).then(function(hash) {
      var hexArr = Array.from(new Uint8Array(hash));
      return hexArr.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
    });
  }
  function doLogin() {
    var pwd = document.getElementById('pwd-input');
    var err = document.getElementById('pwd-err');
    if (!pwd || !pwd.value) return;
    sha256(pwd.value).then(function(h) {
      if (h === PWD_HASH) {
        localStorage.setItem('wd_auth', (Date.now() + SEVEN_DAYS).toString());
        document.getElementById('pwd-gate').style.display = 'none';
      } else {
        if (err) err.style.display = 'block';
        pwd.value = '';
        pwd.focus();
      }
    });
  }
  function initAuth() {
    var gate = document.getElementById('pwd-gate');
    var btn = document.getElementById('pwd-btn');
    var input = document.getElementById('pwd-input');
    if (!gate) return;
    // Auto-login check
    var a = localStorage.getItem('wd_auth');
    if (a && parseInt(a) > Date.now()) {
      gate.style.display = 'none';
    } else {
      localStorage.removeItem('wd_auth');
    }
    // Bind events
    if (btn) btn.addEventListener('click', doLogin);
    if (input) input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAuth);
  } else {
    initAuth();
  }
})();
</script>
</head>
<body>
<div id="pwd-gate" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999">
  <div style="text-align:center;max-width:360px;width:100%;padding:24px">
    <div style="font-size:32px;margin-bottom:8px">&#x1F4CA;</div>
    <h1 style="font-size:18px;font-weight:700;color:var(--t1);margin-bottom:4px">金融研究仪表盘</h1>
    <p style="font-size:12px;color:var(--t4);margin-bottom:20px">wudaoseng.com · 私人访问</p>
    <input id="pwd-input" type="password" placeholder="输入访问密码"
      style="width:100%;padding:12px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--t1);font-size:14px;outline:none;margin-bottom:12px">
    <button id="pwd-btn"
      style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">
      进入
    </button>
    <p id="pwd-err" style="font-size:11px;color:#ef4444;margin-top:8px;display:none">密码错误，请重试</p>
  </div>
</div>
<div class="sidebar">
  <div class="s-logo"><h1>&#x1F4CA; 金融研究仪表盘</h1><p>wudaoseng.com</p></div>
  <div class="s-nav">

<script>
function toggleTheme() {
  var current = document.documentElement.getAttribute('data-theme');
  var next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('wd_theme', next);
  document.getElementById('themeBtn').textContent = next === 'light' ? '\u2600\uFE0F' : '\uD83C\uDF19';
}
(function() {
  var t = localStorage.getItem('wd_theme');
  if (t) {
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeBtn').textContent = t === 'light' ? '\u2600\uFE0F' : '\uD83C\uDF19';
  }
})();
// APP
var cTab = 'overview', cPage = 1, PG = 20, fV = VIDEOS.slice(), selV = {};
function swTab(t) {
  if (typeof t === 'string') {
    document.querySelectorAll('.tab').forEach(function(x) { x.classList.toggle('active', x.dataset.t === t); });
    cTab = t;
  } else {
    document.querySelectorAll('.tab').forEach(function(x) { x.classList.remove('active'); });
    t.classList.add('active');
    cTab = t.dataset.t;
  }
  document.querySelectorAll('[id^="tc-"]').forEach(function(x) { x.style.display = 'none'; });
  document.getElementById('tc-' + cTab).style.display = '';
  render(cTab);
}
function render(t) {
  if (t === 'overview') rOverview();
  else if (t === 'ups') rUps();
  else if (t === 'tasks') rTasks();
  else if (t === 'browse') rBrowse();
  else if (t === 'factors') rFactors();
  else if (t === 'project') rProject();
}
function catCls(c) {
  if (c.includes('\u5B8F\u89C2') && c.includes('\u5927\u5B97') && c.includes('\u80A1\u7968')) return 't-other';
  if ((c.includes('\u5B8F\u89C2') && c.includes('\u5927\u5B97')) || (c.includes('\u5B8F\u89C2') && c.includes('\u80A1\u7968')) || (c.includes('\u5927\u5B97') && c.includes('\u80A1\u7968'))) return 't-mix';
  if (c.includes('\u5B8F\u89C2')) return 't-macro';
  if (c.includes('\u5927\u5B97') || c.includes('\u671F\u8D27')) return 't-comm';
  if (c.includes('\u80A1\u7968')) return 't-stock';
  return 't-other';
}
function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }


function filterPlat(plat, btn) {
  document.querySelectorAll('.plat-filter button').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  document.querySelectorAll('#upGrid .up-c').forEach(function(card) {
    if (plat === 'all' || card.dataset.platform === plat) {
      card.style.display = '';
    } else {
      card.style.display = 'none';
    }
  });
}

function openAddUpModal(prefillName) {
  // Create modal using DOM to avoid quote issues
  var overlay = document.createElement('div');
  overlay.className = 'add-up-modal';
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };

  var panel = document.createElement('div');
  panel.className = 'add-up-panel';

  // Header
  var header = document.createElement('div');
  header.className = 'add-up-header';
  var title = document.createElement('div');
  title.className = 'add-up-title';
  title.textContent = '添加UP主';
  var closeBtn = document.createElement('button');
  closeBtn.className = 'btn btn-o btn-s';
  closeBtn.textContent = '✕';
  closeBtn.onclick = function() { overlay.remove(); };
  header.appendChild(title);
  header.appendChild(closeBtn);

  // Body
  var body = document.createElement('div');
  body.className = 'add-up-body';

  // Field: Platform
  var fPlat = document.createElement('div');
  fPlat.className = 'add-up-field';
  fPlat.innerHTML = '<label>平台</label><select id="addUpPlat"><option value="bilibili">B站 (Bilibili)</option><option value="youtube">YouTube</option><option value="other">其他</option></select>';

  // Field: Name
  var fName = document.createElement('div');
  fName.className = 'add-up-field';
  fName.innerHTML = '<label>UP主名称</label><input id="addUpName" placeholder="输入UP主名称">';

  // Field: ID
  var fId = document.createElement('div');
  fId.className = 'add-up-field';
  fId.innerHTML = '<label>UP主ID</label><input id="addUpId" placeholder="B站UID如 12345 或 YouTube频道ID如 @xxx">';

  // Field: Transcript limit
  var fLimit = document.createElement('div');
  fLimit.className = 'add-up-field';
  fLimit.innerHTML = '<label>初次转录条件</label><div style="display:flex;gap:8px;align-items:center"><input id="addUpLimitCount" type="number" value="500" min="1" style="width:80px"><span style="font-size:11px;color:var(--t3)">条视频</span><span style="margin:0 4px;color:var(--t4)">或</span><input id="addUpLimitDays" type="number" value="365" min="1" style="width:80px"><span style="font-size:11px;color:var(--t3)">天内</span></div><div style="font-size:9px;color:var(--t4);margin-top:4px">满足任一条件即停止初次转录</div>';

  // Field: Auto-track checkbox
  var fTrack = document.createElement('div');
  fTrack.className = 'add-up-field';
  fTrack.style.marginTop = '8px';
  fTrack.innerHTML = '<label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="addUpAutoTrack" checked style="width:16px;height:16px;accent-color:var(--accent)"><span style="font-size:12px;color:var(--t1)">自动追踪更新</span></label><div style="font-size:9px;color:var(--t4);margin-top:2px;margin-left:24px">勾选后，UP主发布新视频时自动转录（不重复转录已有视频）</div>';

  // Footer buttons
  var footer = document.createElement('div');
  footer.className = 'add-up-footer';
  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-o';
  cancelBtn.textContent = '取消';
  cancelBtn.onclick = function() { overlay.remove(); };
  var submitBtn = document.createElement('button');
  submitBtn.className = 'btn btn-p';
  submitBtn.textContent = '提交';
  submitBtn.onclick = function() { submitUpTask(); };
  footer.appendChild(cancelBtn);
  footer.appendChild(submitBtn);

  // Assemble
  body.appendChild(fPlat);
  body.appendChild(fName);
  body.appendChild(fId);
  body.appendChild(fLimit);
  body.appendChild(fTrack);
  body.appendChild(footer);
  panel.appendChild(header);
  panel.appendChild(body);
  overlay.appendChild(panel);
  document.body.appendChild(overlay);

  // Prefill
  if (prefillName) {
    document.getElementById('addUpName').value = prefillName;
    document.getElementById('addUpPlat').value = 'bilibili';
  }
}

function submitUpTask() {
  var plat = document.getElementById('addUpPlat').value;
  var name = document.getElementById('addUpName').value.trim();
  var upId = document.getElementById('addUpId').value.trim();
  var limitCount = document.getElementById('addUpLimitCount').value || '500';
  var limitDays = document.getElementById('addUpLimitDays').value || '365';
  var autoTrack = document.getElementById('addUpAutoTrack').checked;

  if (!name) { alert('请输入UP主名称'); return; }
  if (!upId) { alert('请输入UP主ID'); return; }

  var token = localStorage.getItem('gh_token');
  if (!token) {
    token = prompt('首次提交需要输入GitHub Token（仅存本地，用于写入任务队列）\n\nToken获取: GitHub → Settings → Developer settings → Personal access tokens → Generate new token (勾选repo权限)');
    if (!token) return;
    localStorage.setItem('gh_token', token);
  }

  var task = {
    id: Date.now(),
    action: 'add_up',
    platform: plat,
    name: name,
    upId: upId,
    url: plat === 'bilibili' ? 'https://space.bilibili.com/' + upId : plat === 'youtube' ? 'https://youtube.com/' + upId : '',
    limitCount: parseInt(limitCount),
    limitDays: parseInt(limitDays),
    autoTrack: autoTrack,
    status: 'queued',
    createdAt: new Date().toISOString()
  };

  var repo = 'fengzhisui-maker/dashboard-deploy';
  fetch('https://api.github.com/repos/' + repo + '/contents/pending_queue.js', {
    headers: { 'Authorization': 'token ' + token }
  }).then(function(r) { return r.json(); }).then(function(data) {
    var content = '';
    if (data.content) {
      content = atob(data.content.replace(/\n/g, ''));
      var match = content.match(/var PENDING_QUEUE = (\[[\s\S]*?\]);/);
      var arr = match ? JSON.parse(match[1]) : [];
      arr.push(task);
      var newContent = 'var PENDING_QUEUE = ' + JSON.stringify(arr, null, 2) + ';';
      return fetch('https://api.github.com/repos/' + repo + '/contents/pending_queue.js', {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: 'queue: add ' + plat + ' UP主 ' + name,
          content: btoa(unescape(encodeURIComponent(newContent))),
          sha: data.sha,
          branch: 'main'
        })
      });
    } else {
      var newContent = 'var PENDING_QUEUE = ' + JSON.stringify([task], null, 2) + ';';
      return fetch('https://api.github.com/repos/' + repo + '/contents/pending_queue.js', {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: 'queue: add ' + plat + ' UP主 ' + name,
          content: btoa(unescape(encodeURIComponent(newContent))),
          branch: 'main'
        })
      });
    }
  }).then(function(r) {
    if (r && r.ok) {
      document.querySelector('.add-up-modal').remove();
      if (typeof PENDING_QUEUE === 'undefined') PENDING_QUEUE = [];
      PENDING_QUEUE.push(task);
      rUps();
      showToast('✓ 任务已提交，Agent将自动处理');
      fetch('https://api.github.com/repos/fengzhisui-maker/dashboard-deploy/pages/builds', {
        method: 'POST',
        headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' }
      });
    } else {
      alert('提交失败，请检查GitHub Token是否有效');
    }
  }).catch(function(e) {
    alert('提交失败: ' + e.message);
  });
}

function showToast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;font-size:12px;z-index:1000;animation:slideUp .3s';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}

function rOverview() {
  var mc = VIDEOS.filter(function(v) { return v.category.includes('\u5B8F\u89C2'); }).length;
  var cc = VIDEOS.filter(function(v) { return v.category.includes('\u5927\u5B97'); }).length;
  var upCards = '';
  Object.keys(UP_STATS).forEach(function(n) {
    var i = UP_STATS[n]; var cats = '';
    Object.keys(i.categories).forEach(function(c) { cats += '<span class="tag ' + catCls(c) + '">' + c + ' ' + i.categories[c] + '</span>'; });
    upCards += '<div class=\"up-c\"><div class=\"up-h\"><div style=\"display:flex;align-items:center;gap:6px\"><span class=\"plat-tag ' + (i.platform==='youtube'?'yt':i.platform==='other'?'other':'bili') + '\">' + (i.platform==='youtube'?'YouTube':i.platform==='other'?'其他':'B站') + '</span><div class=\"up-n\">' + n + '</div><div class="up-d">\u6700\u65B0: ' + i.latest + '</div></div><div style="display:flex;gap:16px;margin-bottom:8px"><div style="text-align:center"><div style="font-size:16px;font-weight:700;color:var(--accent2)">' + i.total + '</div><div style="font-size:9px;color:var(--t4)">\u89C6\u9891</div></div></div><div>' + cats + '</div></div>';
  });
  var catCards = '';
  Object.entries(CAT_STATS).sort(function(a,b) { return b[1]-a[1]; }).forEach(function(x) {
    catCards += '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 14px;min-width:180px"><div style="font-size:10px;color:var(--t4);margin-bottom:3px">' + x[0] + '</div><div style="font-size:18px;font-weight:700;color:var(--accent2)">' + x[1] + '</div></div>';
  });
  document.getElementById('tc-overview').innerHTML = '<div data-ref="transcript-overview" class="g2"><div class="card"><div class="l">\u8F6C\u5F55\u89C6\u9891</div><div class="v" style="color:var(--accent2)">' + VIDEOS.length + '</div><div class="s">\u5DF2\u5B8C\u6210</div></div><div class="card"><div class="l">UP\u4E3B</div><div class="v" style="color:var(--info)">' + Object.keys(UP_STATS).length + '</div><div class="s">\u5DF2\u6536\u5F55</div></div><div class="card"><div class="l">\u5B8F\u89C2\u7C7B</div><div class="v" style="color:var(--cat-macro)">' + mc + '</div><div class="s">\u542B\u8DE8\u5206\u7C7B</div></div><div class="card"><div class="l">\u5927\u5B97/\u671F\u8D27</div><div class="v" style="color:var(--cat-comm)">' + cc + '</div><div class="s">\u542B\u8DE8\u5206\u7C7B</div></div></div><h3 style="font-size:13px;margin-bottom:10px">\u5DF2\u6536\u5F55UP\u4E3B</h3><div class="up-g">' + upCards + '</div><h3 style="font-size:13px;margin-bottom:10px">\u5206\u7C7B\u5206\u5E03</h3><div style="display:flex;flex-wrap:wrap;gap:8px">' + catCards + '</div>';
  initRefSystem();
}
function rUps() {
  var filterHtml = '<div class="plat-filter"><button class="active" onclick="filterPlat(\'all\',this)">全部</button><button onclick="filterPlat(\'bilibili\',this)">B站</button><button onclick="filterPlat(\'youtube\',this)">YouTube</button><button onclick="filterPlat(\'other\',this)">其他</button></div>';
  
  var upCards = '';
  Object.keys(UP_STATS).forEach(function(n) {
    var i = UP_STATS[n];
    var cats = '';
    Object.keys(i.categories).forEach(function(c) { cats += '<span class="tag ' + catCls(c) + '">' + c + ' ' + i.categories[c] + '</span>'; });
    var platform = i.platform || 'bilibili';
    var platLabel = platform === 'bilibili' ? 'B站' : platform === 'youtube' ? 'YouTube' : '其他';
    var platClass = platform === 'bilibili' ? 'bili' : platform === 'youtube' ? 'yt' : 'other';
    upCards += '<div class="up-c" data-platform="' + platform + '"><div class="up-h"><div style="display:flex;align-items:center;gap:6px"><span class="plat-tag ' + platClass + '">' + platLabel + '</span><div class="up-n">' + n + '</div></div><div class="up-d">最新: ' + i.latest + '</div></div><div style="display:flex;gap:16px;margin-bottom:8px"><div style="text-align:center"><div style="font-size:16px;font-weight:700;color:var(--accent2)">' + i.total + '</div><div style="font-size:9px;color:var(--t4)">视频</div></div></div><div style="margin-bottom:10px">' + cats + '</div><div style="display:flex;gap:6px"><button class="btn btn-o btn-s" onclick="openAddUpModal(\'' + n + '\')">追加转录</button><button class="btn btn-o btn-s" onclick="browseUp(\'' + n + '\')">浏览内容</button></div></div>';
  });
  
  var pendingHtml = '';
  var totalTasks = 0, doneTasks = 0, processingTasks = 0, errorTasks = 0;
  if (typeof PENDING_QUEUE !== 'undefined' && PENDING_QUEUE.length > 0) {
    PENDING_QUEUE.forEach(function(t) {
      totalTasks++;
      if (t.status === 'done') doneTasks++;
      else if (t.status === 'processing') processingTasks++;
      else if (t.status === 'error') errorTasks++;
    });
    var pct = totalTasks > 0 ? Math.round(doneTasks / totalTasks * 100) : 0;
    pendingHtml = '<div class="pending-section">';
    pendingHtml += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3 style="font-size:12px;color:var(--warn);margin:0">⏳ 任务队列</h3><span style="font-size:11px;color:var(--t3)">' + doneTasks + '/' + totalTasks + ' 完成</span></div>';
    pendingHtml += '<div class="task-progress"><div class="task-progress-bar" style="width:' + pct + '%"></div></div>';
    pendingHtml += '<div class="task-progress-info"><span>进度 ' + pct + '%</span><span>' + (processingTasks > 0 ? processingTasks + ' 执行中' : '') + (errorTasks > 0 ? ' · ' + errorTasks + ' 失败' : '') + '</span></div>';
    PENDING_QUEUE.forEach(function(task) {
      var platLabel = task.platform === 'bilibili' ? 'B站' : task.platform === 'youtube' ? 'YouTube' : '其他';
      var platClass = task.platform === 'bilibili' ? 'bili' : task.platform === 'youtube' ? 'yt' : 'other';
      var statusClass = task.status === 'done' ? 'done' : task.status === 'processing' ? 'processing' : task.status === 'error' ? 'error' : 'queued';
      var statusLabel = task.status === 'done' ? '✓ 完成' : task.status === 'processing' ? '执行中' : task.status === 'error' ? '✗ 失败' : '排队中';
      var progressHtml = '';
      if (task.status === 'processing' && task.progress) {
        progressHtml = '<div class="task-progress"><div class="task-progress-bar" style="width:' + task.progress + '%"></div></div>';
      }
      pendingHtml += '<div class="pending-item"><span class="plat-tag ' + platClass + '">' + platLabel + '</span><span style="flex:1">' + task.name + progressHtml + '</span><span class="pending-status ' + statusClass + '">' + statusLabel + '</span></div>';
    });
    pendingHtml += '</div>';
  }
  
  document.getElementById('tc-ups').innerHTML = '<div data-ref="transcript-ups" style="position:relative"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="font-size:13px">UP主管理</h3><button class="btn btn-p" onclick="openAddUpModal()">➕ 添加UP主</button></div>' + filterHtml + '<div class="up-g" id="upGrid">' + upCards + '</div>' + pendingHtml + '</div>';
  initRefSystem();
}

function applyF() {
  var up = document.getElementById('fUp').value, cat = document.getElementById('fCat').value,

    s = (document.getElementById('fSearch').value || '').toLowerCase(), sort = document.getElementById('fSort').value;
  fV = VIDEOS.filter(function(v) {
    if (up && v.up !== up) return false; if (cat && !v.category.includes(cat)) return false;

    '<div data-ref="project-errors" style="position:relative;margin-bottom:16px"><h3 style="font-size:13px;margin-bottom:10px">\uD83D\uDCDD \u9519\u8BEF\u590D\u76D8</h3>' +
    '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px">' + errHtml + '</div></div>' +


    // === 5. 关键决策日志 ===
    '<div data-ref="project-decisions" style="position:relative;margin-bottom:16px"><h3 style="font-size:13px;margin-bottom:10px">&#x1F4DC; 关键决策日志</h3>' +
    '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px">' + decHtml + '</div></div>' +

    // === 6. 范围边界 ===
    '<div data-ref="project-scope" style="position:relative;margin-bottom:16px"><h3 style="font-size:13px;margin-bottom:10px">&#x1F30D; 范围边界</h3>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px"><div style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:8px">&#x2705; 在范围内</div>' + scopeIn + '</div><div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px"><div style="font-size:11px;font-weight:600;color:var(--danger);margin-bottom:8px">&#x274C; 不在范围内</div>' + scopeOut + '</div></div></div>';

  initRefSystem();
}
function setMod(m) {
  document.querySelectorAll('.s-item').forEach(function(x) { x.classList.remove('active'); });
  if (m === 'transcript') {
    document.querySelector('.s-item:nth-child(2)').classList.add('active');
    document.getElementById('tabs').style.display = '';
    document.getElementById('topTitle').textContent = '转录库';
    document.querySelector('.btn-p').style.display = '';
    swTab('overview');
  } else if (m === 'project') {
    document.querySelector('.s-item:nth-child(3)').classList.add('active');
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('topTitle').textContent = '项目控制台';
    document.querySelector('.btn-p').style.display = 'none';
    document.querySelectorAll('[id^="tc-"]').forEach(function(x) { x.style.display = 'none'; });
    document.getElementById('tc-project').style.display = '';
    rProject();
  }
}
render('overview');
setMod('project');
// 引用ID复制系统
function generateContext(ref) {
  var lines = ['📋 引用上下文'];
  lines.push('Ref: #' + ref);
  var map = (typeof CODE_MAP !== 'undefined') ? CODE_MAP[ref] : null;
  if (map) {
    if (map.module) {
      var modStr = map.module;
      if (map.subModule) modStr += ' > ' + map.subModule;
      lines.push('模块: ' + modStr);
    }
    if (map.layer) lines.push('层级: ' + map.layer);
    if (map.archPath) lines.push('架构: ' + map.archPath);
    if (map.renderer) lines.push('渲染: ' + map.renderer + (map.codeFile ? ' in ' + map.codeFile : ''));
    if (map.dataFile) lines.push('数据: ' + map.dataFile);
    if (map.desc) lines.push('描述: ' + map.desc);
  }
  return lines.join('\n');
}
// 模块下钻详情
function showModuleDetail(modId) {
  var detail = (typeof MODULE_DETAILS !== 'undefined') ? MODULE_DETAILS[modId] : null;
  if (!detail) return;
  var layerMap = {'L4':'展示层','L3':'逻辑层','L2':'数据层','L1':'基础设施层'};
  var layerId = modId.split('-')[0];
  
  // Meta tags
  var metaHtml = '';
  metaHtml += '<div class="bp-drill-meta-item"><strong>层级</strong>' + (layerMap[layerId]||layerId) + '</div>';
  if (detail.archPath) metaHtml += '<div class="bp-drill-meta-item"><strong>架构</strong>' + detail.archPath + '</div>';
  if (detail.renderer) metaHtml += '<div class="bp-drill-meta-item"><strong>渲染</strong>' + detail.renderer + '</div>';
  if (detail.dataFile) metaHtml += '<div class="bp-drill-meta-item"><strong>数据</strong>' + detail.dataFile + '</div>';
  if (detail.codeFile) metaHtml += '<div class="bp-drill-meta-item"><strong>代码</strong>' + detail.codeFile + '</div>';
  
  // Sub-modules
  var subsHtml = '';
  if (detail.subModules && detail.subModules.length > 0) {
    detail.subModules.forEach(function(sub) {
      var statusCls = sub.status === 'active' ? 'active' : 'planned';
      var statusText = sub.status === 'active' ? '已实现' : '规划中';
      subsHtml += '<div data-ref="' + sub.id + '" class="bp-drill-sub">';
      subsHtml += '<div class="bp-drill-sub-name">' + sub.name + '<span class="bp-drill-sub-status ' + statusCls + '">' + statusText + '</span></div>';
      subsHtml += '<div class="bp-drill-sub-desc">' + (sub.desc || '') + '</div>';
      if (sub.renderer) subsHtml += '<div style="font-size:9px;color:var(--t4);margin-top:4px">渲染: ' + sub.renderer + '</div>';
      if (sub.dataFile) subsHtml += '<div style="font-size:9px;color:var(--t4)">数据: ' + sub.dataFile + '</div>';
      subsHtml += '</div>';
    });
  } else {
    subsHtml = '<div style="font-size:11px;color:var(--t4);text-align:center;padding:20px">暂无子模块定义</div>';
  }
  
  var statusCls = detail.status === 'active' ? 'active' : detail.status === 'planned' ? 'planned' : 'placeholder';
  var statusText = detail.status === 'active' ? '已实现' : detail.status === 'planned' ? '规划中' : '占位';
  
  var html = '<div class="bp-drill" onclick="if(event.target===this)closeModuleDetail()">' +
    '<div class="bp-drill-panel">' +
    '<div class="bp-drill-header">' +
    '<button class="bp-drill-back" onclick="closeModuleDetail()">←</button>' +
    '<div class="bp-drill-title">' + detail.name + '</div>' +
    '<span class="bp-drill-status ' + statusCls + '">' + statusText + '</span>' +
    '</div>' +
    '<div class="bp-drill-body">' +
    '<div class="bp-drill-meta">' + metaHtml + '</div>' +
    '<div class="bp-drill-desc">' + (detail.desc || '') + '</div>' +
    '<div class="bp-drill-subs-title">子模块 (' + (detail.subModules ? detail.subModules.length : 0) + ')</div>' +
    subsHtml +
    '</div></div></div>';
  
  document.body.insertAdjacentHTML('beforeend', html);
  initRefSystem();
  // ESC键关闭
  document.addEventListener('keydown', function escHandler(e) {
    if (e.key === 'Escape') {
      closeModuleDetail();
      document.removeEventListener('keydown', escHandler);
    }
  });
}

function closeModuleDetail() {
  var drill = document.querySelector('.bp-drill');
  if (drill) drill.remove();
}

function initRefSystem() {
  // 清除旧的复制按钮
  document.querySelectorAll('.ref-copy-btn').forEach(function(b) { b.remove(); });
  // 给所有带data-ref的元素添加复制按钮
  document.querySelectorAll('[data-ref]').forEach(function(el) {
    // 跳过已处理过的
    if (el.querySelector('.ref-copy-btn')) return;
    var btn = document.createElement('button');
    btn.className = 'ref-copy-btn';
    btn.textContent = '📋';
    var ref = el.getAttribute('data-ref');
    var contextText = generateContext(ref);
    btn.title = '复制引用上下文';
    // 创建tooltip预览
    var tooltip = document.createElement('div');
    tooltip.className = 'ref-tooltip';
    tooltip.textContent = contextText;
    btn.appendChild(tooltip);
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      e.preventDefault();
      navigator.clipboard.writeText(contextText).then(function() {
        btn.textContent = '✓';
        btn.classList.add('copied');
        setTimeout(function() {
          btn.textContent = '📋';
          btn.classList.remove('copied');
        }, 1500);
      });
    });
    el.appendChild(btn);
  });
}
</script>
