<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融研究仪表盘</title>

<!-- CSS模块 -->
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/transcript.css">
<link rel="stylesheet" href="css/blueprint.css">

<!-- 密码模块 - 已隔离，不要移动或修改 -->
<script>
(function() {
  var PWD_HASH = 'ac50201d8b39de3e403adc70ae473c786d0ccc46c694ba8d68c84b0e1633c71e';
  var SEVEN_DAYS = 7 * 24 * 60 * 60 * 1000;
  
  function sha256(str) {
    var buffer = new TextEncoder().encode(str);
    return crypto.subtle.digest('SHA-256', buffer).then(function(hash) {
      var hexArr = Array.from(new Uint8Array(hash));
      return hexArr.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
    });
  }
  
  function doLogin() {
    var pwd = document.getElementById('pwd-input');
    var err = document.getElementById('pwd-err');
    if (!pwd || !pwd.value) return;
    sha256(pwd.value).then(function(h) {
      if (h === PWD_HASH) {
        localStorage.setItem('wd_auth', (Date.now() + SEVEN_DAYS).toString());
        document.getElementById('pwd-gate').style.display = 'none';
        // 初始化应用
        if (window.initApp) window.initApp();
      } else {
        if (err) err.style.display = 'block';
        pwd.value = '';
        pwd.focus();
      }
    });
  }
  
  function initAuth() {
    var gate = document.getElementById('pwd-gate');
    var btn = document.getElementById('pwd-btn');
    var input = document.getElementById('pwd-input');
    if (!gate) return;
    var a = localStorage.getItem('wd_auth');
    if (a && parseInt(a) > Date.now()) {
      gate.style.display = 'none';
      // 已认证，初始化应用
      if (window.initApp) window.initApp();
    } else {
      localStorage.removeItem('wd_auth');
    }
    if (btn) btn.addEventListener('click', doLogin);
    if (input) input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAuth);
  } else {
    initAuth();
  }
})();
</script>
</head>
<body>

<!-- 密码验证门 -->
<div id="pwd-gate" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999">
  <div style="text-align:center;max-width:360px;width:100%;padding:24px">
    <div style="font-size:32px;margin-bottom:8px">📊</div>
    <h1 style="font-size:18px;font-weight:700;color:var(--t1);margin-bottom:4px">金融研究仪表盘</h1>
    <p style="font-size:12px;color:var(--t4);margin-bottom:20px">wudaoseng.com · 私人访问</p>
    <input id="pwd-input" type="password" placeholder="输入访问密码"
      style="width:100%;padding:12px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--t1);font-size:14px;outline:none;margin-bottom:12px">
    <button id="pwd-btn"
      style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">
      进入
    </button>
    <p id="pwd-err" style="font-size:11px;color:var(--danger);margin-top:8px;display:none">密码错误，请重试</p>
  </div>
</div>

<!-- 应用容器 -->
<div class="app-container">
  
  <!-- 侧边栏 -->
  <div class="sidebar" id="sidebar">
    <!-- 由sidebar.js渲染 -->
  </div>
  
  <!-- 主内容区 -->
  <div class="main-wrapper">
    <!-- 顶部栏 -->
    <div class="topbar">
      <h2 id="topTitle">转录库</h2>
      <div class="topbar-right">
        <!-- 刷新按钮由sidebar.js动态添加 -->
      </div>
    </div>
    
    <!-- 内容区 -->
    <div class="content-wrapper">
      <div id="mainContent" class="content">
        <div class="loading">加载中...</div>
      </div>
    </div>
  </div>
  
</div>

<!-- 详情侧边栏 -->
<div class="detail-panel" id="detailPanel">
  <div class="detail-header">
    <h3 id="detailTitle">详情</h3>
    <button class="btn btn-g btn-s" onclick="closeDetailPanel()">✕</button>
  </div>
  <div class="detail-body" id="detailBody">
    <!-- 由JS渲染 -->
  </div>
  <div class="detail-footer">
    <button class="btn btn-o btn-s" onclick="closeDetailPanel()">关闭</button>
  </div>
</div>

<!-- JS模块 -->
<script type="module">
import { ThemeState, ToastState } from './js/store/state.js';
import { loadUpNameCache } from './js/compute/business.js';
import { initRouter } from './js/router.js';
import { renderSidebar, addRefreshButton } from './js/views/sidebar.js';
import { DetailPanelState } from './js/store/state.js';

// 应用初始化
window.initApp = async function() {
  console.log('[App] 开始初始化...');
  
  try {
    // 1. 初始化主题
    ThemeState.init();
    console.log('[App] 主题已初始化');
    
    // 2. 渲染侧边栏
    renderSidebar();
    console.log('[App] 侧边栏已渲染');
    
    // 3. 添加刷新按钮
    addRefreshButton();
    console.log('[App] 刷新按钮已添加');
    
    // 4. 预加载UP主名称
    await loadUpNameCache();
    console.log('[App] UP主名称已缓存');
    
    // 5. 初始化路由
    initRouter();
    console.log('[App] 路由已初始化');
    
    console.log('[App] 初始化完成!');
  } catch (error) {
    console.error('[App] 初始化失败:', error);
    ToastState.error('初始化失败: ' + error.message);
  }
};

// 关闭详情面板
window.closeDetailPanel = function() {
  DetailPanelState.close();
};

// 页面加载完成后尝试初始化
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  // 检查是否已认证
  const auth = localStorage.getItem('wd_auth');
  if (auth && parseInt(auth) > Date.now()) {
    setTimeout(window.initApp, 100);
  }
}
</script>

</body>
</html>
