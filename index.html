<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融研究仪表盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1a1b1e;--bg2:#222326;--bg3:#2a2b2f;--bg4:#333438;
  --border:#3a3b40;--border2:#4a4b50;
  --t1:#f0f0f2;--t2:#b0b0b8;--t3:#888890;--t4:#666670;
  --accent:#22c55e;--accent2:#4ade80;--accent-bg:rgba(34,197,94,0.10);
  --danger:#ef4444;--warn:#eab308;--info:#3b82f6;
  --cat-macro:#a78bfa;--cat-comm:#fb923c;--cat-stock:#34d399;--cat-other:#9ca3af;--cat-mix:#fbbf24;
  --sidebar-bg:#1e1f23;--topbar-bg:#222326;--input-bg:#2a2b2f;--hover-bg:#333438;
}
[data-theme="light"]{
  --bg:#f0f1f3;--bg2:#ffffff;--bg3:#ffffff;--bg4:#f7f8fa;
  --border:#e0e1e5;--border2:#d0d1d5;
  --t1:#1a1a2e;--t2:#555566;--t3:#888899;--t4:#aaaabb;
  --accent:#c4192c;--accent2:#e03050;--accent-bg:rgba(196,25,44,0.06);
  --danger:#c4192c;--warn:#d48806;--info:#1890ff;
  --cat-macro:#722ed1;--cat-comm:#d46b08;--cat-stock:#389e0d;--cat-other:#8c8c8c;--cat-mix:#d4b106;
  --sidebar-bg:#1a1a2e;--topbar-bg:#ffffff;--input-bg:#f7f8fa;--hover-bg:#eef0f3;
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--t1);display:flex;height:100vh;overflow:hidden;transition:background .2s,color .2s}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sidebar{width:200px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
[data-theme="light"] .sidebar{color:#e0e0e8}
.s-logo{padding:20px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.s-logo h1{font-size:13px;font-weight:700;color:var(--accent2);letter-spacing:-0.02em}
[data-theme="light"] .s-logo h1{color:#e03050}
.s-logo p{font-size:10px;color:rgba(255,255,255,.35);margin-top:3px}
[data-theme="light"] .s-logo p{color:rgba(255,255,255,.5)}
.s-nav{padding:8px 6px;flex:1}
.s-section{font-size:9px;text-transform:uppercase;color:rgba(255,255,255,.3);padding:14px 10px 5px;letter-spacing:1px}
.s-item{display:flex;align-items:center;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:rgba(255,255,255,.6);margin-bottom:1px;transition:.15s}
.s-item:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
.s-item.active{background:rgba(34,197,94,.15);color:#4ade80;font-weight:500}
[data-theme="light"] .s-item.active{background:rgba(224,48,80,.15);color:#e03050}
.s-item.off{opacity:.35;cursor:not-allowed}
.s-item .ic{margin-right:8px;font-size:14px;width:18px;text-align:center}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:44px;background:var(--topbar-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;justify-content:space-between;flex-shrink:0;transition:background .2s}
.topbar h2{font-size:13px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:10px}
.btn{padding:5px 14px;border-radius:5px;border:none;cursor:pointer;font-size:11px;font-weight:500;transition:.15s}
.btn-p{background:var(--accent);color:#fff}[data-theme="light"] .btn-p{color:#fff}.btn-p:hover{opacity:.85}
.btn-o{background:transparent;color:var(--t2);border:1px solid var(--border)}.btn-o:hover{border-color:var(--border2);color:var(--t1)}
.btn-s{padding:3px 8px;font-size:10px}
.theme-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s;color:var(--t2)}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.content{flex:1;overflow-y:auto;padding:16px 20px;transition:background .2s}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:8px 16px;font-size:12px;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.tab:hover{color:var(--t1)}.tab.active{color:var(--accent2);border-bottom-color:var(--accent)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px;transition:background .2s,border .2s}
.card .l{font-size:10px;color:var(--t4);margin-bottom:4px}
.card .v{font-size:22px;font-weight:700}
.card .s{font-size:10px;color:var(--t3);margin-top:3px}
.up-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:18px}
.up-c{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px;transition:background .2s,border .2s}
.up-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.up-n{font-size:14px;font-weight:600}
.up-d{font-size:10px;color:var(--t4)}
.tag{font-size:9px;padding:2px 7px;border-radius:8px;display:inline-block;margin:2px}
.t-macro{color:var(--cat-macro);background:color-mix(in srgb,var(--cat-macro) 12%,transparent)}
.t-comm{color:var(--cat-comm);background:color-mix(in srgb,var(--cat-comm) 12%,transparent)}
.t-stock{color:var(--cat-stock);background:color-mix(in srgb,var(--cat-stock) 12%,transparent)}
.t-other{color:var(--cat-other);background:color-mix(in srgb,var(--cat-other) 12%,transparent)}
.t-mix{color:var(--cat-mix);background:color-mix(in srgb,var(--cat-mix) 12%,transparent)}
.fbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.fbar select,.fbar input{background:var(--input-bg);border:1px solid var(--border);color:var(--t1);padding:6px 10px;border-radius:5px;font-size:11px;transition:background .2s,border .2s}
.fbar input{flex:1;min-width:180px}
.fbar select:focus,.fbar input:focus{outline:none;border-color:var(--accent)}
.vl{display:flex;flex-direction:column;gap:6px}
.vi{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:12px 14px;cursor:pointer;transition:.15s}
.vi:hover{border-color:var(--accent);background:var(--hover-bg)}
.vi .vh{display:flex;justify-content:space-between;align-items:center}
.vi .vt{font-size:12px;font-weight:500;flex:1}
.vi .vm{display:flex;gap:10px;font-size:10px;color:var(--t4);align-items:center}
.vi .vp{font-size:11px;color:var(--t2);line-height:1.6;margin-top:8px;max-height:0;overflow:hidden;transition:max-height .3s}
.vi.open .vp{max-height:500px;overflow-y:auto}
.detail{position:fixed;top:0;right:-560px;width:560px;height:100vh;background:var(--bg2);border-left:1px solid var(--border);z-index:100;transition:right .3s,background .2s;display:flex;flex-direction:column}
.detail.show{right:0}
.detail .dh{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.detail .dh h3{font-size:13px;font-weight:600;flex:1;margin-right:8px}
.detail .db{flex:1;overflow-y:auto;padding:16px}
.detail .dm{margin-bottom:12px}.detail .dm span{font-size:10px;color:var(--t4);margin-right:12px}
.detail .dc{font-size:12px;line-height:1.8;color:var(--t2);white-space:pre-wrap}
.pag{display:flex;justify-content:center;gap:4px;margin-top:14px}
.pb{padding:5px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--t2);cursor:pointer;font-size:11px}
.pb.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* 架构蓝图 */
.layer-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;transition:background .2s,border .2s}
.layer-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.layer-indicator{width:4px;height:36px;border-radius:2px;flex-shrink:0}
.layer-title{font-size:14px;font-weight:700}
.layer-subtitle{font-size:10px;color:var(--t4)}
.layer-desc{font-size:11px;color:var(--t3)}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.mod-card{background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:10px;transition:.15s}
.mod-card.active{border-style:solid}
.mod-card.placeholder{border-style:dashed;opacity:.5}
.mod-card.planned{border-style:dashed;opacity:.7}
.mod-name{font-size:12px;font-weight:600;margin-bottom:4px}
.mod-desc{font-size:9px;color:var(--t4);line-height:1.4}
.mod-children{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.mod-child{font-size:8px;padding:1px 5px;border-radius:3px;background:var(--bg3);color:var(--t3)}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
.status-dot.active{background:var(--accent)}
.status-dot.planned{background:var(--warn)}
.status-dot.placeholder{background:var(--t4)}
.restructure-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:16px}
.restructure-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.restructure-compare{display:flex;align-items:center;gap:8px;font-size:11px}
.arrow{color:var(--t3);font-size:14px}
.step-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.step-item:last-child{border-bottom:none}
.step-num{width:20px;height:20px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--t3)}
.step-info{flex:1}
.step-name{font-size:12px;font-weight:500}
.step-desc{font-size:10px;color:var(--t4)}
.priority-tag{font-size:9px;padding:2px 6px;border-radius:3px}
.priority-high{background:rgba(239,68,68,0.15);color:var(--danger)}
.priority-medium{background:rgba(234,179,8,0.15);color:var(--warn)}
/* 引用ID复制按钮 */
[data-ref]{position:relative}
.ref-copy-btn{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:5px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:12px;display:none;align-items:center;justify-content:center;z-index:10;color:var(--t3);transition:.15s;opacity:0.7}
[data-ref]:hover > .ref-copy-btn{display:flex}
[data-ref]:has([data-ref]:hover) > .ref-copy-btn{display:none !important}
.ref-copy-btn:hover{opacity:1;border-color:var(--accent);color:var(--accent)}
.ref-copy-btn.copied{color:var(--accent);opacity:1}

.ref-tooltip{position:absolute;top:100%;right:0;margin-top:4px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:10px;color:var(--t2);white-space:pre;line-height:1.5;z-index:200;pointer-events:none;display:none;min-width:240px;max-width:360px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.ref-copy-btn:hover > .ref-tooltip{display:block}
/* 侧边栏导航项 - 悬浮显示ref标签 */
.s-nav{position:relative}
.s-item[data-ref]:hover::after{content:"#" attr(data-ref);position:absolute;left:60px;top:50%;transform:translateY(-50%);background:var(--bg3);border:1px solid var(--border);padding:2px 8px;border-radius:4px;font-size:10px;color:var(--t3);white-space:nowrap;z-index:100}
</style>
</head>
<body>
<div id="pwd-gate" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999">

<script>
// PASSWORD - simple hash check, 7 day expiry
var PWD_HASH = 'ac50201d8b39de3e403adc70ae473c786d0ccc46c694ba8d68c84b0e1633c71e';
var SEVEN_DAYS = 7 * 24 * 60 * 60 * 1000;
function sha256(str) {
  var buffer = new TextEncoder().encode(str);
  return crypto.subtle.digest('SHA-256', buffer).then(function(hash) {
    var hexArr = Array.from(new Uint8Array(hash));
    return hexArr.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
  });
}
function doLogin() {
  var pwd = document.getElementById('pwd-input').value;
  if (!pwd) return;
  sha256(pwd).then(function(h) {
    if (h === PWD_HASH) {
      localStorage.setItem('wd_auth', (Date.now() + SEVEN_DAYS).toString());
      document.getElementById('pwd-gate').style.display = 'none';
    } else {
      document.getElementById('pwd-err').style.display = 'block';
      document.getElementById('pwd-input').value = '';
      document.getElementById('pwd-input').focus();
    }
  });
}
// Bind events
document.getElementById('pwd-btn').addEventListener('click', doLogin);
document.getElementById('pwd-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
// Auto-login check
(function() {
  var a = localStorage.getItem('wd_auth');
  if (a && parseInt(a) > Date.now()) {
    document.getElementById('pwd-gate').style.display = 'none';
  } else {
    localStorage.removeItem('wd_auth');
  }
})();
// THEME
function toggleTheme() {
  var current = document.documentElement.getAttribute('data-theme');
  var next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('wd_theme', next);
  document.getElementById('themeBtn').textContent = next === 'light' ? '\u2600\uFE0F' : '\uD83C\uDF19';
}
(function() {
  var t = localStorage.getItem('wd_theme');
  if (t) {
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeBtn').textContent = t === 'light' ? '\u2600\uFE0F' : '\uD83C\uDF19';
  }
})();
// APP
var cTab = 'overview', cPage = 1, PG = 20, fV = VIDEOS.slice(), selV = {};
function swTab(t) {
  if (typeof t === 'string') {
    document.querySelectorAll('.tab').forEach(function(x) { x.classList.toggle('active', x.dataset.t === t); });
    cTab = t;
  } else {
    document.querySelectorAll('.tab').forEach(function(x) { x.classList.remove('active'); });
    t.classList.add('active');
    cTab = t.dataset.t;
  }
  document.querySelectorAll('[id^="tc-"]').forEach(function(x) { x.style.display = 'none'; });
  document.getElementById('tc-' + cTab).style.display = '';
  render(cTab);
}
function render(t) {
  if (t === 'overview') rOverview();
  else if (t === 'ups') rUps();
  else if (t === 'tasks') rTasks();
  else if (t === 'browse') rBrowse();
  else if (t === 'factors') rFactors();
  else if (t === 'project') rProject();
}
function catCls(c) {
  if (c.includes('\u5B8F\u89C2') && c.includes('\u5927\u5B97') && c.includes('\u80A1\u7968')) return 't-other';
  if ((c.includes('\u5B8F\u89C2') && c.includes('\u5927\u5B97')) || (c.includes('\u5B8F\u89C2') && c.includes('\u80A1\u7968')) || (c.includes('\u5927\u5B97') && c.includes('\u80A1\u7968'))) return 't-mix';
  if (c.includes('\u5B8F\u89C2')) return 't-macro';
  if (c.includes('\u5927\u5B97') || c.includes('\u671F\u8D27')) return 't-comm';
  if (c.includes('\u80A1\u7968')) return 't-stock';
  return 't-other';
}
function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function rOverview() {
  var mc = VIDEOS.filter(function(v) { return v.category.includes('\u5B8F\u89C2'); }).length;
  var cc = VIDEOS.filter(function(v) { return v.category.includes('\u5927\u5B97'); }).length;
  var upCards = '';
  Object.keys(UP_STATS).forEach(function(n) {
    var i = UP_STATS[n]; var cats = '';
    Object.keys(i.categories).forEach(function(c) { cats += '<span class="tag ' + catCls(c) + '">' + c + ' ' + i.categories[c] + '</span>'; });
    upCards += '<div class="up-c"><div class="up-h"><div class="up-n">' + n + '</div><div class="up-d">\u6700\u65B0: ' + i.latest + '</div></div><div style="display:flex;gap:16px;margin-bottom:8px"><div style="text-align:center"><div style="font-size:16px;font-weight:700;color:var(--accent2)">' + i.total + '</div><div style="font-size:9px;color:var(--t4)">\u89C6\u9891</div></div></div><div>' + cats + '</div></div>';
  });
  var catCards = '';
  Object.entries(CAT_STATS).sort(function(a,b) { return b[1]-a[1]; }).forEach(function(x) {
    catCards += '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 14px;min-width:180px"><div style="font-size:10px;color:var(--t4);margin-bottom:3px">' + x[0] + '</div><div style="font-size:18px;font-weight:700;color:var(--accent2)">' + x[1] + '</div></div>';
  });

    '<div><div style="font-size:10px;color:var(--t4);margin-bottom:2px">当前阶段</div><div style="font-size:14px;font-weight:600;color:var(--accent2)">' + p.phase + '</div></div>' +
    '<div style="display:flex;align-items:center;gap:12px"><div style="width:120px;height:6px;background:var(--input-bg);border-radius:3px;overflow:hidden"><div style="height:100%;background:var(--accent);width:' + pct + '%"></div></div><span style="font-size:13px;font-weight:700;color:var(--accent2)">' + pct + '%</span></div>' +
    '<div style="font-size:10px;color:var(--t4)">更新: ' + p.lastUpdate + '</div>' +
    '</div>' +

    // === 2. 架构蓝图 (上移到第二位) ===
    '<div data-ref="project-blueprint" style="position:relative;margin-bottom:16px"><h3 style="font-size:13px;margin-bottom:10px">&#x1F3AF; 架构蓝图</h3>' +
    bpHtml + '</div>' +

    // === 3. 里程碑时间线 ===
    '<div data-ref="project-milestones" style="position:relative;margin-bottom:16px"><h3 style="font-size:13px;margin-bottom:10px">&#x1F4C5; 里程碑时间线</h3>' +
    '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px">' + msHtml + '</div></div>' +

    // === 4. 任务看板 ===
    '<div data-ref="project-kanban" style="position:relative;margin-bottom:16px"><h3 style="font-size:13px;margin-bottom:10px">&#x1F4BC; 任务看板</h3>' +
    kanbanHtml + '</div>' +

    // === 5. 关键决策日志 ===
    '<div data-ref="project-decisions" style="position:relative;margin-bottom:16px"><h3 style="font-size:13px;margin-bottom:10px">&#x1F4DC; 关键决策日志</h3>' +
    '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px">' + decHtml + '</div></div>' +

    // === 6. 范围边界 ===
    '<div data-ref="project-scope" style="position:relative;margin-bottom:16px"><h3 style="font-size:13px;margin-bottom:10px">&#x1F30D; 范围边界</h3>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px"><div style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:8px">&#x2705; 在范围内</div>' + scopeIn + '</div><div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px"><div style="font-size:11px;font-weight:600;color:var(--danger);margin-bottom:8px">&#x274C; 不在范围内</div>' + scopeOut + '</div></div></div>';

  initRefSystem();
}
function setMod(m) {
  document.querySelectorAll('.s-item').forEach(function(x) { x.classList.remove('active'); });
  if (m === 'transcript') {
    document.querySelector('.s-item:nth-child(2)').classList.add('active');
    document.getElementById('tabs').style.display = '';
    document.getElementById('topTitle').textContent = '转录库';
    document.querySelector('.btn-p').style.display = '';
    swTab('overview');
  } else if (m === 'project') {
    document.querySelector('.s-item:nth-child(3)').classList.add('active');
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('topTitle').textContent = '项目控制台';
    document.querySelector('.btn-p').style.display = 'none';
    document.querySelectorAll('[id^="tc-"]').forEach(function(x) { x.style.display = 'none'; });
    document.getElementById('tc-project').style.display = '';
    rProject();
  }
}
render('overview');
setMod('project');
// 引用ID复制系统
function generateContext(ref) {
  var lines = ['📋 引用上下文'];
  lines.push('Ref: #' + ref);
  var map = (typeof CODE_MAP !== 'undefined') ? CODE_MAP[ref] : null;
  if (map) {
    if (map.module) {
      var modStr = map.module;
      if (map.subModule) modStr += ' > ' + map.subModule;
      lines.push('模块: ' + modStr);
    }
    if (map.layer) lines.push('层级: ' + map.layer);
    if (map.archPath) lines.push('架构: ' + map.archPath);
    if (map.renderer) lines.push('渲染: ' + map.renderer + (map.codeFile ? ' in ' + map.codeFile : ''));
    if (map.dataFile) lines.push('数据: ' + map.dataFile);
    if (map.desc) lines.push('描述: ' + map.desc);
  }
  return lines.join('\n');
}
function initRefSystem() {
  // 清除旧的复制按钮
  document.querySelectorAll('.ref-copy-btn').forEach(function(b) { b.remove(); });
  // 给所有带data-ref的元素添加复制按钮
  document.querySelectorAll('[data-ref]').forEach(function(el) {
    // 跳过已处理过的
    if (el.querySelector('.ref-copy-btn')) return;
    var btn = document.createElement('button');
    btn.className = 'ref-copy-btn';
    btn.textContent = '📋';
    var ref = el.getAttribute('data-ref');
    var contextText = generateContext(ref);
    btn.title = '复制引用上下文';
    // 创建tooltip预览
    var tooltip = document.createElement('div');
    tooltip.className = 'ref-tooltip';
    tooltip.textContent = contextText;
    btn.appendChild(tooltip);
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      e.preventDefault();
      navigator.clipboard.writeText(contextText).then(function() {
        btn.textContent = '✓';
        btn.classList.add('copied');
        setTimeout(function() {
          btn.textContent = '📋';
          btn.classList.remove('copied');
        }, 1500);
      });
    });
    el.appendChild(btn);
  });
}
</script>
